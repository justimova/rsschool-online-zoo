  <main>
    <section class="section contact">
      <h1>Online Zoo</h1>
      <div class="contact--inner">
        <div class="contact--content">
          <div class="contact--title">
            <h2>Registration</h2>
          </div>

          <div class="contact--form" id="registration-form">
            <div class="form-field" id="login-field">
              <label class="body--text"><span class="required">*</span> Login</label>
              <input id="login-input" class="body--text" type="text" placeholder="Enter login">
              <div class="error-message" id="login-error"></div>
            </div>

            <div class="form-field" id="password-field">
              <label class="body--text"><span class="required">*</span> Password</label>
              <input id="password-input" class="body--text" type="password" placeholder="Enter password">
              <div class="error-message" id="password-error"></div>
            </div>

            <div class="form-field" id="confirm-password-field">
              <label class="body--text"><span class="required">*</span> Confirm Password</label>
              <input id="confirm-password-input" class="body--text" type="password" placeholder="Confirm password">
              <div class="error-message" id="confirm-password-error"></div>
            </div>

            <div class="form-field" id="name-field">
              <label class="body--text"><span class="required">*</span> Your Name</label>
              <input id="name-input" class="body--text" type="text" placeholder="Enter your name">
              <div class="error-message" id="name-error"></div>
            </div>

            <div class="form-field" id="email-field">
              <label class="body--text"><span class="required">*</span> Your Email Address</label>
              <input id="email-input" class="body--text" type="email" placeholder="Enter your email">
              <div class="error-message" id="email-error"></div>
            </div>

            <div class="error-message" id="form-error"></div>

            <div class="action-panel">
              <button id="register-button" class="btn btn--primary btn--text link-arrow" type="button" disabled>
                Register
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>
